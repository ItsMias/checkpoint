<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The package never leaves the browser: no external scripts, nothing uploaded.
       With images on (the default, can be turned off) the page loads avatars/emoji/icons from Discord's CDN,
       Steam cover art, and asks Discord's public API about invite codes and the detectable games list. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://discord.com; img-src 'self' blob: data: https://cdn.discordapp.com https://cdn.cloudflare.steamstatic.com; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Checkpoint Rewind</title>
  <meta name="description" content="Your year on Discord, rebuilt from your own data package. Everything runs in your browser; your data is never uploaded.">

  <!-- Link previews. Discord shows the component embed below; everything else (and Discord as a
       fallback) uses the Open Graph tags. Tags must be in the HTML: crawlers don't run scripts. -->
  <!-- Discord caches images by URL: when assets/og.png changes, change its ?v= (both places below). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Checkpoint Rewind">
  <meta property="og:title" content="Checkpoint Rewind">
  <meta property="og:description" content="See your messages, voice hours, top servers, games and your Checkpoint card for any year. Works with “Use data to improve Discord” turned off.">
  <meta property="og:url" content="https://checkpoint.itsmias.xyz/">
  <meta property="og:image" content="https://checkpoint.itsmias.xyz/assets/og.png?v=068f625f">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Checkpoint Rewind: Cat, Capybara and Bonsai cards">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#3df07a">
  <script id="discord:component-embed" type="application/json">
{
  "component": {
    "type": 17,
    "accent_color": 4059258,
    "components": [
      {
        "type": 12,
        "items": [
          {
            "media": {
              "url": "https://checkpoint.itsmias.xyz/assets/og.png?v=068f625f"
            },
            "description": "Checkpoint Rewind: Cat, Capybara and Bonsai cards"
          }
        ]
      },
      {
        "type": 10,
        "content": "# Checkpoint Rewind\nSee your messages, voice hours, top servers, games and your Checkpoint card for any year."
      },
      {
        "type": 10,
        "content": "-# Works with “Use data to improve Discord” turned off."
      },
      {
        "type": 1,
        "components": [
          {
            "type": 2,
            "style": 5,
            "label": "Open Checkpoint",
            "url": "https://checkpoint.itsmias.xyz/"
          },
          {
            "type": 2,
            "style": 5,
            "label": "Source code",
            "url": "https://github.com/ItsMias/checkpoint"
          }
        ]
      }
    ]
  }
}
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="stage" id="stage">
    <header class="chrome-top">
      <button class="logo" id="logo" type="button" aria-label="Back to start"></button>
      <nav class="pips" id="pips" aria-label="Cards"></nav>
      <div class="top-actions">
        <button class="sq" id="music" type="button" aria-label="Turn music off"></button>
        <button class="sq" id="close" type="button" aria-label="Close and start over" hidden></button>
      </div>
    </header>
    <main class="slides" id="slides" aria-live="polite"></main>
    <footer class="chrome-bottom">
      <button class="sq shadowed" id="prev" type="button" aria-label="Previous card" hidden></button>
      <p class="fineprint" id="fineprint">Not affiliated with or endorsed by Discord.</p>
      <button class="sq shadowed" id="next" type="button" aria-label="Next card" hidden></button>
    </footer>
  </div>
  <noscript><p class="noscript">This page needs JavaScript to read your data package locally.</p></noscript>
</body>
</html>
