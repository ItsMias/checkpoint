# Publishes web/ (the whole static site, including the prebuilt web/pkg engine) to GitHub Pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tells Bing (and the other IndexNow search engines) the page changed. The key file is
      # web/<key>.txt; it must be live before the ping, so wait for it. A failed ping doesn't fail the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          HOST: checkpoint.itsmias.xyz
          KEY: 8274b3aaa9faeb1b4fb4898e915e0a11
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors -o /dev/null "https://$HOST/$KEY.txt"
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[\"https://$HOST/\"]}" \
            -w 'IndexNow: HTTP %{http_code}\n'
